<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Console - Independent Broadcast</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --amber-glow: #ffb733; 
            --bg-dark: #050302;
        }

        html, body { 
            width: 100%;
            height: 100%;
            overflow: hidden; 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            background: var(--bg-dark);
            color: #d8c2a8; 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; 
            align-items: center; 
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        *, *:before, *:after { box-sizing: inherit; }

        .console-container {
            position: relative; 
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            max-height: 100vh;
            max-width: 177.78vh;
            background: #2b1408 url('photo/radioconsole image.jpg') center/100% 100% no-repeat;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            overflow: hidden; 
        }

        .interactive-volume { position: absolute; top: 24%; left: 5.5%; width: 8%; height: 20%; cursor: pointer; z-index: 4; }
        .interactive-tuning { position: absolute; top: 24%; right: 5.5%; width: 8%; height: 20%; cursor: pointer; z-index: 4; }
        .interactive-dial { position: absolute; top: 21.5%; left: 17%; right: 17%; height: 27%; cursor: pointer; touch-action: none; z-index: 4; }
        
        .tuning-indicator-bar {
            position: absolute; 
            top: 27.3%; 
            height: 5.2%; 
            width: 8px;
            background: #ffe885;
            border-radius: 2px; 
            box-shadow: 0 0 8px var(--amber-glow);
            transform: translateX(-50%); 
            pointer-events: none; 
            z-index: 3;
        }

        .screen-display {
            position: absolute; top: 53.5%; left: 27%; right: 27%; height: 10.5%;
            background: rgba(12, 6, 2, 0.95); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
            color: var(--amber-glow); letter-spacing: 1px; padding: 0 8px; text-align: center; z-index: 5;
            font-family: monospace;
        }

        .visualizer { position: absolute; top: 73.5%; left: 5%; right: 5%; height: 12.5%; pointer-events: none; z-index: 4; }
        #visualizerCanvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="console-container">
        <div class="interactive-volume" id="volumeTrigger"></div>
        <div id="tuningBar" class="tuning-indicator-bar" style="left: 50%;"></div>
        <div class="interactive-dial" id="dialWindow"></div>
        <div class="interactive-tuning" id="tuningTrigger"></div>
        <div class="screen-display" id="stationDisplay">TAP DIAL TO POWER ON</div>
        <div class="visualizer"><canvas id="visualizerCanvas"></canvas></div>
    </div>

    <audio id="mainAudio" preload="auto" playsinline webkit-playsinline></audio>

    <script>
        const STATION_MANIFEST = {
            88.0: { name: "Omega", file: "audio/estrange.mp3" },                    
            88.3: { name: "ICI Première / Montréal", file: "https://rcavliveaudio.akamaized.net/hls/live/2006635/P-2QMTL0_MTL/master.m3u8", isLive: true },
            89.5: { name: "CIUT 89.5 FM / Toronto", file: "https://ice23.securenetsystems.net/CIUT", isLive: true },
            90.3: { name: "CKUT 90.3 FM / Montréal", file: "https://ckut.out.airtime.pro/ckut_a", isLive: true },
            91.9: { name: "CJSW 90.9 FM / Calgary", file: "https://cjsw.leanstream.co/CJSWFM-MP3?args=web_03", isLive: true },
            97.8: { name: "Sud Radio en ligne", file: "https://start-sud.ice.infomaniak.ch/start-sud-high.mp3", isLive: true },
            98.5: { name: "ICI Musique Classique", file: "https://rcavliveaudio.akamaized.net/hls/live/2007000/MUSE/master.m3u8", isLive: true },
            108.0: { name: "ICI Première / Ottawa", file: "https://rcavliveaudio.akamaized.net/hls/live/2006986/M-7OOTT0_OTT/master.m3u8", isLive: true }
        };

        class SimpleRadio {
            constructor(manifest, el) {
                this.stations = manifest;
                this.keys = Object.keys(manifest).map(Number);
                this.el = el;
                this.activeFreq = null;
                this.isPowered = false;
                this.hls = null;
                this.volume = 0.8;

                this.initCanvas();
                this.bind();
                this.loop();
            }

            initCanvas() {
                const resize = () => {
                    const r = this.el.canvas.getBoundingClientRect();
                    this.el.canvas.width = r.width * window.devicePixelRatio;
                    this.el.canvas.height = r.height * window.devicePixelRatio;
                    this.el.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                };
                window.addEventListener('resize', resize);
                resize();
            }

            bind() {
                const handleInput = (clientX) => {
                    if (!this.isPowered) {
                        this.isPowered = true;
                        this.tune(this.keys[0], true);
                        return;
                    }
                    const r = this.el.dial.getBoundingClientRect();
                    const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
                    const freq = 88.0 + (ratio * 20.0);
                    this.tune(freq, false);
                };

                this.el.dial.addEventListener('pointerdown', (e) => handleInput(e.clientX));
                this.el.dial.addEventListener('pointermove', (e) => { if (e.buttons > 0) handleInput(e.clientX); });

                this.el.volume.addEventListener('click', () => {
                    if (!this.isPowered) return;
                    this.volume = this.volume >= 1.0 ? 0.2 : Number((this.volume + 0.2).toFixed(1));
                    this.el.audio.volume = this.volume;
                    this.el.display.textContent = `VOLUME: ${Math.round(this.volume * 100)}%`;
                });

                this.el.tuningTrigger.addEventListener('click', () => {
                    if (!this.isPowered) {
                        this.isPowered = true;
                        this.tune(this.keys[0], true);
                        return;
                    }
                    const idx = (this.keys.indexOf(this.activeFreq) + 1) % this.keys.length;
                    this.tune(this.keys[idx], true);
                });
            }

            tune(targetFreq, force) {
                const closest = this.keys.reduce((p, c) => Math.abs(c - targetFreq) < Math.abs(p - targetFreq) ? c : p);
                const pct = 18.0 + ((targetFreq - 88.0) / 20.0) * 64.0;
                this.el.bar.style.left = `${Math.max(18, Math.min(82, pct))}%`;

                const station = this.stations[closest];
                this.el.display.textContent = `${station.name} (${closest.toFixed(1)} MHz)`;

                if (force || this.activeFreq !== closest) {
                    this.activeFreq = closest;
                    this.load(station.file, station.isLive);
                }
            }

            load(url, isLive) {
                if (this.hls) { this.hls.destroy(); this.hls = null; }
                const a = this.el.audio;
                a.pause();
                a.src = '';
                a.loop = !isLive;
                a.volume = this.volume;

                if (isLive && url.endsWith('.m3u8')) {
                    if (a.canPlayType('application/vnd.apple.mpegurl')) {
                        a.src = url;
                        a.play().catch(() => {});
                    } else if (Hls.isSupported()) {
                        this.hls = new Hls();
                        this.hls.loadSource(url);
                        this.hls.attachMedia(a);
                        this.hls.on(Hls.Events.MANIFEST_PARSED, () => a.play().catch(() => {}));
                    }
                } else {
                    a.src = url;
                    a.play().catch(() => {
                        this.el.display.textContent = `TAP SCREEN TO PLAY`;
                    });
                }
            }

            loop() {
                requestAnimationFrame(() => this.loop());
                const { canvas, ctx, audio } = this.el;
                const w = canvas.getBoundingClientRect().width;
                const h = canvas.getBoundingClientRect().height;
                ctx.clearRect(0, 0, w, h);

                const active = this.isPowered && !audio.paused;
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = active ? 'rgba(255, 157, 0, 0.8)' : 'rgba(74, 44, 0, 0.3)';
                ctx.beginPath();

                const time = performance.now() * 0.005;
                for (let i = 0; i < 80; i++) {
                    const x = (i / 80) * w;
                    let y = h / 2;
                    if (active) y += Math.sin(i * 0.15 + time * 4) * 10;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SimpleRadio(STATION_MANIFEST, {
                dial: document.getElementById('dialWindow'),
                bar: document.getElementById('tuningBar'),
                volume: document.getElementById('volumeTrigger'),
                tuningTrigger: document.getElementById('tuningTrigger'),
                display: document.getElementById('stationDisplay'),
                audio: document.getElementById('mainAudio'),
                canvas: document.getElementById('visualizerCanvas'),
                ctx: document.getElementById('visualizerCanvas').getContext('2d')
            });
        });
    </script>
</body>
</html>
