<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radio Console - Independent Broadcast</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --amber-glow: #ffb733; 
            --dim-amber: rgba(255, 183, 51, 0.15); 
            --bg-dark: #050302;
        }

        html, body { 
            max-width: 100%; 
            overflow-x: hidden; 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        *, *:before, *:after { box-sizing: inherit; }
        
        body {
            background: var(--bg-dark) url('photo/background.png') center/cover fixed no-repeat;
            color: #d8c2a8; 
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            min-height: 100dvh; 
            padding: 20px; 
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        body::before {
            content: ''; 
            position: fixed; 
            inset: 0;
            background: radial-gradient(circle at center, rgba(40, 20, 8, 0.4) 0%, rgba(5, 3, 2, 0.9) 85%);
            pointer-events: none; 
            z-index: 1;
        }

        .scanlines {
            position: fixed; 
            inset: 0; 
            pointer-events: none; 
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 14, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            opacity: 0.6;
        }

        .console-container {
            position: relative; 
            width: 100%; 
            max-width: 900px; 
            aspect-ratio: 16 / 9;
            background: #2b1408 url('photo/radioconsole image.jpg') center/100% 100% no-repeat;
            box-shadow: 0 40px 80px rgba(0,0,0,0.98), 0 0 30px rgba(255, 130, 0, 0.05);
            border-radius: 12px; 
            overflow: hidden; 
            z-index: 2;
            border: 2px solid rgba(40, 20, 10, 0.8);
        }

        .interactive-volume { position: absolute; top: 24%; left: 5.5%; width: 8%; height: 20%; cursor: pointer; border-radius: 50%; z-index: 4; }
        .interactive-tuning { position: absolute; top: 24%; right: 5.5%; width: 8%; height: 20%; cursor: pointer; border-radius: 50%; z-index: 4; }
        .interactive-dial { position: absolute; top: 21.5%; left: 17%; right: 17%; height: 27%; cursor: grab; touch-action: none; z-index: 4; }
        .interactive-dial:active { cursor: grabbing; }
        
        .tuning-indicator-bar {
            position: absolute; 
            top: 27.3%; 
            height: 5.2%; 
            width: 10px;
            background: linear-gradient(to bottom, rgba(255,150,0,0.6), #ffe885 50%, rgba(255,150,0,0.6));
            border-radius: 2px; 
            box-shadow: 0 0 10px 2px var(--amber-glow), inset 0 0 3px #fff;
            transform: translateX(-50%); 
            pointer-events: none; 
            will-change: left; 
            z-index: 3;
            transition: left 0.08s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .screen-display {
            position: absolute; top: 53.5%; left: 27%; right: 27%; height: 10.5%;
            background: rgba(12, 6, 2, 0.9); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
            color: var(--amber-glow); letter-spacing: 1.5px; text-shadow: 0 0 8px var(--amber-glow);
            box-shadow: inset 0 0 12px rgba(255, 157, 0, 0.25); padding: 0 10px; text-align: center; z-index: 5;
            font-family: monospace, monospace;
        }

        .visualizer { position: absolute; top: 73.5%; left: 5%; right: 5%; height: 12.5%; pointer-events: none; z-index: 4; }
        #visualizerCanvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body tabindex="0">
    <div class="scanlines"></div>
    
    <div class="console-container">
        <div class="interactive-volume" id="volumeTrigger" title="Adjust Volume"></div>
        <div id="tuningBar" class="tuning-indicator-bar" style="left: 50%;"></div>
        <div class="interactive-dial" id="dialWindow" role="slider" aria-label="Radio Tuning Dial" aria-valuemin="88" aria-valuemax="108"></div>
        <div class="interactive-tuning" id="tuningTrigger" title="Scan Station"></div>
        <div class="screen-display" id="stationDisplay">RECEIVER STATUS: STANDBY... TAP OR CLICK DIAL TO POWER ON</div>
        <div class="visualizer"><canvas id="visualizerCanvas"></canvas></div>
    </div>

    <audio id="mainAudio" preload="auto" playsinline></audio>

    <script>
        const tuningBar = document.getElementById('tuningBar');
        const stationDisplay = document.getElementById('stationDisplay');
        const audioEl = document.getElementById('mainAudio');
        const dialWindow = document.getElementById('dialWindow');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;

        let audioCtx = null, analyser = null, sourceNode = null, gainNode = null, hls = null;
        let isPowerOn = false, particles = [];

        function initParticles(w, h) {
            particles = Array.from({length: 20}, () => ({
                x: Math.random() * w, y: Math.random() * h,
                size: Math.random() * 2 + 0.5, speed: Math.random() * 0.4 + 0.1, opacity: Math.random() * 0.3 + 0.1
            }));
        }

        function resize() {
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initParticles(rect.width, rect.height);
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                sourceNode = audioCtx.createMediaElementSource(audioEl);
                sourceNode.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch (e) { console.error(e); }
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            particles.forEach(p => {
                p.x -= p.speed; if (p.x < 0) p.x = w;
                ctx.fillStyle = `rgba(255, 157, 0, ${p.opacity})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            const buf = analyser ? analyser.frequencyBinCount : 512;
            const data = new Uint8Array(buf);
            if (analyser && isPowerOn && !audioEl.paused && audioEl.readyState >= 2) {
                analyser.getByteTimeDomainData(data);
            } else {
                data.fill(128);
            }

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = (isPowerOn && !audioEl.paused && audioEl.readyState >= 2) ? 'rgba(255, 157, 0, 0.85)' : 'rgba(74, 44, 0, 0.4)';
            ctx.beginPath();
            const slice = w / buf;
            for (let i = 0, x = 0; i < buf; i++, x += slice) {
                const y = ((data[i] / 128.0) - 1.0) * (h * 1.1) + (h / 2);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        window.addEventListener('resize', resize);
        resize(); requestAnimationFrame(draw);

        const STATION_MANIFEST = {
            88.0: { name: 'Omega', file: 'audio/estrange.mp3' },                    
            88.3: { name: 'ICI Première / Montréal', file: 'https://rcavliveaudio.akamaized.net/hls/live/2006635/P-2QMTL0_MTL/master.m3u8', isLive: true },
            88.5: { name: 'Duo Improbable - Trent Reznor & Johnny Cash - Hurt', file: 'audio/Hurt.MP3' },
            89.0: { name: 'Iota Alpha', file: 'audio/always.mp3' },
            89.5: { name: 'CIUT 89.5 FM / Toronto', file: 'https://ice23.securenetsystems.net/CIUT', isLive: true },
            90.0: { name: 'Kappa Zeta', file: 'audio/automatism.mp3' },
            90.3: { name: 'CKUT 90.3 FM / Montréal', file: 'https://ckut.out.airtime.pro/ckut_a', isLive: true },
            91.0: { name: 'Mu Delta', file: 'audio/bliss.mp3' },
            91.5: { name: 'Sessions', file: 'audio/Sessions.mp3' },
            91.7: { name: 'Lambda Delta', file: 'audio/chase.mp3' },
            91.9: { name: 'CJSW 90.9 FM / Calgary', file: 'https://cjsw.leanstream.co/CJSWFM-MP3?args=web_03', isLive: true },
            92.0: { name: 'Lambda Eta', file: 'audio/cinderella shoe.mp3' },
            92.5: { name: 'Iota Delta', file: 'audio/cohesion.mp3' },
            93.0: { name: 'Mu Beta', file: 'audio/dancer.mp3' },
            93.3: { name: 'Duo Improbable - Eric Carmen & Céline Dion - All By Myself', file: 'audio/All by Myself.MP3' },
            93.5: { name: 'Lambda Theta', file: 'audio/dynamite.mp3' },
            94.0: { name: 'Mu', file: 'audio/equanimity.mp3' },
            94.5: { name: 'Kappa Alpha', file: 'audio/esprit itinerant.mp3' },
            95.0: { name: 'Lambda Alpha', file: 'audio/Late.mp3' },
            95.1: { name: 'Duo Improbable - Stewart Copeland & Sting - King of Pain', file: 'audio/King of Pain.MP3' },
            96.0: { name: 'Lambda Mu', file: 'audio/father.mp3' },
            96.5: { name: 'Lambda Stigma', file: 'audio/grave.mp3' },
            97.0: { name: 'Kappa Eta', file: 'audio/inversion.mp3' },
            97.5: { name: 'Mu Alpha', file: 'audio/lucioles.mp3' },
            97.8: { name: 'Sud Radio en ligne', file: 'https://start-sud.ice.infomaniak.ch/start-sud-high.mp3', isLive: true },
            98.0: { name: 'Kappa Gamma', file: 'audio/mass effect.mp3' },
            98.5: { name: 'ICI Musique Classique', file: 'https://rcavliveaudio.akamaized.net/hls/live/2007000/MUSE/master.m3u8', isLive: true },
            99.0: { name: 'Iota Stigma', file: 'audio/melancoly in flat.mp3' },
            99.5: { name: 'Mu Epsilon', file: 'audio/monster.mp3' },
            100.0: { name: 'Iota Epsilon', file: 'audio/Narcosis.mp3' },
            100.5: { name: 'Lambda Nu', file: 'audio/next flight home.mp3' },
            101.0: { name: 'Lambda', file: 'audio/oticons.mp3' },
            101.5: { name: 'Lambda Gamma', file: 'audio/pacis.mp3' },
            101.7: { name: 'Duo Improbable - Donna Summer & Clara Luciani', file: 'audio/I Feel Love Donna Summer ~  C\'est L\'Amour Clara Luciani V2.wav' },
            102.0: { name: 'Iota Zeta', file: 'audio/push.mp3' },
            102.5: { name: 'Kappa Theta', file: 'audio/quantum touch.mp3' },
            103.0: { name: 'Mu Zeta', file: 'audio/quaturo.mp3' },
            103.5: { name: 'Iota Eta', file: 'audio/recalcitrant.mp3' },
            104.0: { name: 'Iota Zeta', file: 'audio/resounding.mp3' },
            104.5: { name: 'Lambda Xi', file: 'audio/sacrifice.mp3' },
            105.0: { name: 'Iota', file: 'audio/slow think.mp3' },
            105.5: { name: 'Kappa Iota', file: 'audio/soleil.mp3' },
            106.0: { name: 'Kappa Delta', file: 'audio/spectrum.mp3' },
            106.5: { name: 'Lambda Zeta', file: 'audio/stubborness.mp3' },
            107.0: { name: 'Mu Theta', file: 'audio/tangerine.mp3' },
            107.5: { name: 'Kappa Beta', file: 'audio/the daunting.mp3' },

            108.0: { name: "ICI Première / Ottawa", file: "https://rcavliveaudio.akamaized.net/hls/live/2006986/M-7OOTT0_OTT/master.m3u8", isLive: true }
        };

        class RadioConsoleEngine {
            constructor(manifest, elements) {
                this.stations = manifest;
                this.stationKeys = Object.keys(manifest).map(Number);
                this.el = elements;
                
                this.state = {
                    isPoweredOn: false,
                    isDragging: false,
                    targetFreq: 88.0,
                    activeFreq: null,
                    volume: 0.8
                };

                this.hlsInstance = null;
                this.animFrameId = null;
                
                this.init();
            }

            init() {
                this.setupCanvas();
                this.bindEvents();
                this.startVisualizerLoop();
            }

            setupCanvas() {
                const updateSize = () => {
                    const rect = this.el.canvas.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    this.el.canvas.width = rect.width * dpr;
                    this.el.canvas.height = rect.height * dpr;
                    this.el.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                };
                window.addEventListener('resize', updateSize);
                updateSize();
            }

            bindEvents() {
                const { dial, volume, audio, tuningTrigger } = this.el;

                dial.addEventListener('pointerdown', (e) => {
                    if (!this.state.isPoweredOn) {
                        this.state.isPoweredOn = true;
                        this.tune(88.0, true);
                    }
                    this.state.isDragging = true;
                    try { dial.setPointerCapture(e.pointerId); } catch(err) {}
                    this.handleDialMove(e.clientX);
                });

                dial.addEventListener('pointermove', (e) => {
                    if (!this.state.isDragging) return;
                    this.handleDialMove(e.clientX);
                });

                dial.addEventListener('pointerup', (e) => {
                    if (this.state.isDragging) {
                        this.state.isDragging = false;
                        try { dial.releasePointerCapture(e.pointerId); } catch(err) {}
                        this.tune(this.state.targetFreq, true);
                    }
                });

                volume.addEventListener('click', () => {
                    if (!this.state.isPoweredOn) return;
                    this.state.volume = this.state.volume >= 1.0 ? 0.2 : Number((this.state.volume + 0.2).toFixed(1));
                    audio.volume = this.state.volume;
                    this.el.display.textContent = `[ VOLUME ] ${Math.round(this.state.volume * 100)}%`;
                });

                tuningTrigger.addEventListener('click', () => {
                    if (!this.state.isPoweredOn) {
                        this.state.isPoweredOn = true;
                        this.tune(this.stationKeys[0], true);
                        return;
                    }
                    const currentIndex = this.stationKeys.indexOf(this.state.activeFreq);
                    const nextIndex = (currentIndex + 1) % this.stationKeys.length;
                    this.state.targetFreq = this.stationKeys[nextIndex];
                    this.tune(this.state.targetFreq, true);
                });

                audio.addEventListener('error', () => {
                    this.el.display.textContent = `[ ERROR ] Stream/File unavailable`;
                });
            }

            handleDialMove(clientX) {
                const rect = this.el.dial.getBoundingClientRect();
                if (rect.width === 0) return;
                const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                this.state.targetFreq = 88.0 + (ratio * 20.0);
                this.tune(this.state.targetFreq, false);
            }

            tune(targetFreq, forceSwitch) {
                if (!this.state.isPoweredOn) return;

                const closest = this.stationKeys.reduce((p, c) => Math.abs(c - targetFreq) < Math.abs(p - targetFreq) ? c : p);
                const percent = 18.0 + ((targetFreq - 88.0) / 20.0) * 64.0;
                
                this.el.tuningBar.style.left = `${Math.max(18.0, Math.min(82.0, percent))}%`;
                this.el.dial.setAttribute('aria-valuenow', targetFreq.toFixed(1));

                const station = this.stations[closest];
                this.el.display.textContent = `[ ${station.isLive ? 'LIVE' : 'PLAYING'} ] > ${station.name} (${closest.toFixed(1)} MHz)`;

                if (forceSwitch || this.state.activeFreq !== closest) {
                    this.state.activeFreq = closest;
                    this.loadSource(station.file, station.isLive);
                }
            }

            loadSource(url, isLive) {
                const { audio } = this.el;

                if (this.hlsInstance) {
                    this.hlsInstance.destroy();
                    this.hlsInstance = null;
                }

                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                audio.loop = !isLive;
                audio.volume = this.state.volume;

                const encodedUrl = encodeURI(url);
                this.el.display.textContent = `[ TUNING... ] Loading stream...`;

                const isIOSWebKit = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                if (isLive && url.endsWith('.m3u8')) {
                    if (isIOSWebKit || audio.canPlayType('application/vnd.apple.mpegurl')) {
                        audio.src = encodedUrl;
                        audio.load();
                        audio.play().catch(err => console.warn("Native HLS play deferred:", err));
                    } else if (Hls.isSupported()) {
                        this.hlsInstance = new Hls({ 
                            xhrSetup: (xhr) => { xhr.withCredentials = false; },
                            autoStartLoad: true
                        });
                        this.hlsInstance.loadSource(encodedUrl);
                        this.hlsInstance.attachMedia(audio);
                        
                        this.hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.warn("HLS Network error encountered, attempting recovery...");
                                        this.hlsInstance.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.warn("HLS Media error encountered, recovering media...");
                                        this.hlsInstance.recoverMediaError();
                                        break;
                                    default:
                                        this.hlsInstance.destroy();
                                        this.el.display.textContent = `[ ERROR ] Stream dropped`;
                                        break;
                                }
                            }
                        });

                        this.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            audio.play().catch(err => console.warn("HLS play deferred:", err));
                        });
                    }
                } else {
                    audio.src = encodedUrl;
                    audio.load();
                    audio.play().catch((err) => {
                        console.warn("Autoplay block caught:", err);
                        this.el.display.textContent = `[ TAP DIAL ] Tap dial to engage audio`;
                    });
                }
            }

            startVisualizerLoop() {
                const render = () => {
                    this.animFrameId = requestAnimationFrame(render);
                    const { canvas, ctx, audio } = this.el;
                    if (!canvas || !ctx) return;

                    const w = canvas.getBoundingClientRect().width;
                    const h = canvas.getBoundingClientRect().height;
                    ctx.clearRect(0, 0, w, h);

                    const isPlaying = this.state.isPoweredOn && !audio.paused && audio.readyState >= 2;
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = isPlaying ? 'rgba(255, 157, 0, 0.85)' : 'rgba(74, 44, 0, 0.4)';
                    ctx.beginPath();

                    const slices = 120;
                    const sliceWidth = w / slices;
                    const time = performance.now() * 0.005;

                    for (let i = 0; i < slices; i++) {
                        const x = i * sliceWidth;
                        let yOffset = h / 2;

                        if (isPlaying) {
                            yOffset += Math.sin(i * 0.12 + time * 4) * 12 + Math.cos(i * 0.05 - time * 2.5) * 8;
                        }

                        if (i === 0) ctx.moveTo(x, yOffset);
                        else ctx.lineTo(x, yOffset);
                    }
                    ctx.stroke();
                };
                render();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new RadioConsoleEngine(STATION_MANIFEST, {
                dial: document.getElementById('dialWindow'),
                tuningBar: document.getElementById('tuningBar'),
                volume: document.getElementById('volumeTrigger'),
                tuningTrigger: document.getElementById('tuningTrigger'),
                display: document.getElementById('stationDisplay'),
                audio: document.getElementById('mainAudio'),
                canvas: document.getElementById('visualizerCanvas'),
                ctx: document.getElementById('visualizerCanvas').getContext('2d')
            });
        });
    </script>
</body>
</html>
