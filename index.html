<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Console</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1a1a1e;
            --accent-glow: #ffb703;
            --text-color: #e0e0e0;
            --scale-font-size: 0.75rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow: hidden;
        }

        .radio-console {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--panel-color);
            padding: 16px;
            gap: 16px;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .console-title {
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-glow);
        }

        /* Oscilloscope Visualizer */
        .visualizer-container {
            width: 100%;
            height: 120px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Frequency Scale & Tuner */
        .tuner-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #151518;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #2a2a2e;
        }

        .scale-numbers {
            display: flex;
            justify-content: space-between;
            font-size: var(--scale-font-size);
            color: #888;
            padding: 0 4px;
        }

        /* Hide alternating frequency numbers on narrow screens to prevent overlap */
        @media (max-width: 480px) {
            .scale-numbers span:nth-child(even) {
                display: none;
            }
        }

        .frequency-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-glow);
            text-shadow: 0 0 8px rgba(255, 183, 3, 0.4);
        }

        /* Controls Deck */
        .controls-deck {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .console-btn {
            flex: 1;
            background: #25252a;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 14px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .console-btn:active {
            background: var(--accent-glow);
            color: #000;
            border-color: var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="radio-console">
        <header class="console-header">
            <span class="console-title">Radio Console // Mk.IV</span>
            <span class="status-indicator">● LIVE</span>
        </header>

        <!-- Oscilloscope Visualizer Deck -->
        <div class="visualizer-container">
            <canvas id="oscilloscope"></canvas>
        </div>

        <!-- Tuner & Scale Section -->
        <div class="tuner-section">
            <div class="frequency-display">101.1 MHz</div>
            <div class="scale-numbers">
                <span>88</span>
                <span>92</span>
                <span>96</span>
                <span>100</span>
                <span>104</span>
                <span>108</span>
            </div>
        </div>

        <!-- Primary Controls -->
        <div class="controls-deck">
            <button class="console-btn" id="power-btn">Power</button>
            <button class="console-btn" id="scan-btn">Scan</button>
            <button class="console-btn" id="mute-btn">Mute</button>
        </div>
    </div>

</body>
</html>
