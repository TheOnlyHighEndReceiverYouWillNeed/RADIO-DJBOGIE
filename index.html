<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Console - Independent Broadcast</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0d0c0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .console-cabinet {
            background: linear-gradient(135deg, #2b1d15, #18100c);
            border: 12px solid #080504;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 2px 8px rgba(255,255,255,0.05);
            width: 750px;
            text-align: center;
        }

        .brand-plate {
            font-size: 14px;
            letter-spacing: 4px;
            color: #8c7355;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .dial-housing {
            background: #050505;
            border: 6px inset #1f140f;
            height: 130px;
            position: relative;
            margin-bottom: 25px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 10px 25px rgba(0,0,0,0.9);
        }

        .frequency-scale-bar {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Car radio style tick marks for every integer frequency */
        .freq-tick {
            position: absolute;
            bottom: 25px;
            width: 2px;
            height: 12px;
            background: #443322;
            transform: translateX(-50%);
        }

        .freq-tick.major {
            height: 22px;
            background: #887766;
        }

        .freq-tick.station-tick {
            background: #ff5500;
            height: 26px;
            box-shadow: 0 0 6px #ff3300;
        }

        .freq-tick.station-tick.active {
            background: #4cd137;
            box-shadow: 0 0 10px #4cd137;
        }

        .freq-label {
            position: absolute;
            bottom: 5px;
            transform: translateX(-50%);
            font-size: 11px;
            color: #665544;
        }

        .needle {
            position: absolute;
            left: 0%;
            top: 0;
            width: 3px;
            height: 100%;
            background: #ff3300;
            box-shadow: 0 0 12px #ff3300, 0 0 4px #ff3300;
            transition: left 0.05s ease-out;
            z-index: 5;
        }

        .dial-glass-glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(255,255,255,0));
            pointer-events: none;
            z-index: 6;
        }

        .screen-display {
            background: #080c08;
            border: 2px solid #1a261a;
            padding: 15px;
            border-radius: 4px;
            font-size: 15px;
            color: #4cd137;
            min-height: 32px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(76, 209, 55, 0.4);
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #8c7355;
            cursor: pointer;
            height: 8px;
            background: #111;
            border-radius: 4px;
        }

        .helper-text {
            font-size: 11px;
            color: #554433;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="console-cabinet">
        <div class="brand-plate">Model IV - Custom High Fidelity Receiver</div>
        
        <div class="dial-housing">
            <div class="dial-glass-glare"></div>
            <!-- Graphical Car Radio Scale Container -->
            <div class="frequency-scale-bar" id="scaleBar"></div>
            <div id="needle" class="needle"></div>
        </div>
        
        <div class="screen-display" id="stationDisplay">
            RECEIVER STATUS: STANDBY... SWEEP DIAL TO SCAN FREQUENCIES
        </div>

        <div class="controls-panel">
            <input type="range" id="tuner" min="85" max="110" step="1" value="85">
        </div>
        
        <div class="helper-text" style="margin-top: 15px;">Manual Frequency Tuning Knob</div>
    </div>

    <!-- All 24 Local WAV Audio Files -->
    <audio id="track1" src="audio/mass effect.wav" preload="auto" loop></audio>
    <audio id="track2" src="audio/there.wav" preload="auto" loop></audio>
    <audio id="track3" src="audio/oticons.wav" preload="auto" loop></audio>
    <audio id="track4" src="audio/caprizant.wav" preload="auto" loop></audio>
    <audio id="track5" src="audio/arise.wav" preload="auto" loop></audio>
    <audio id="track6" src="audio/stubborness.wav" preload="auto" loop></audio>
    <audio id="track7" src="audio/the daunting.wav" preload="auto" loop></audio>
    <audio id="track8" src="audio/quaturo.wav" preload="auto" loop></audio>
    <audio id="track9" src="audio/melancoly in flat.wav" preload="auto" loop></audio>
    <audio id="track10" src="audio/next flight home.wav" preload="auto" loop></audio>
    <audio id="track11" src="audio/cinderella shoe.wav" preload="auto" loop></audio>
    <audio id="track12" src="audio/chase.wav" preload="auto" loop></audio>
    <audio id="track13" src="audio/writes itself.wav" preload="auto" loop></audio>
    <audio id="track14" src="audio/monster.wav" preload="auto" loop></audio>
    <audio id="track15" src="audio/Blisss.wav" preload="auto" loop></audio>
    <audio id="track16" src="audio/tangerine.wav" preload="auto" loop></audio>
    <audio id="track17" src="audio/across bourbon street.wav" preload="auto" loop></audio>
    <audio id="track18" src="audio/eveille.wav" preload="auto" loop></audio>
    <audio id="track19" src="audio/grave.wav" preload="auto" loop></audio>
    <audio id="track20" src="audio/always.wav" preload="auto" loop></audio>
    <audio id="track21" src="audio/dancer.wav" preload="auto" loop></audio>
    <audio id="track22" src="audio/push.wav" preload="auto" loop></audio>
    <audio id="track23" src="audio/resounding.wav" preload="auto" loop></audio>
    <audio id="track24" src="audio/pacis.wav" preload="auto" loop></audio>

    <script>
        const tuner = document.getElementById('tuner');
        const needle = document.getElementById('needle');
        const stationDisplay = document.getElementById('stationDisplay');
        const scaleBar = document.getElementById('scaleBar');

        const minFreq = 85;
        const maxFreq = 110;

        const stations = {
            86: { title: "TRANSMISSION: Mass Effect", audio: document.getElementById('track1') },
            87: { title: "TRANSMISSION: There", audio: document.getElementById('track2') },
            88: { title: "TRANSMISSION: Oticons", audio: document.getElementById('track3') },
            89: { title: "TRANSMISSION: Caprizant", audio: document.getElementById('track4') },
            90: { title: "TRANSMISSION: Arise", audio: document.getElementById('track5') },
            91: { title: "TRANSMISSION: Stubborness", audio: document.getElementById('track6') },
            92: { title: "TRANSMISSION: The Daunting", audio: document.getElementById('track7') },
            93: { title: "TRANSMISSION: Quaturo", audio: document.getElementById('track8') },
            94: { title: "TRANSMISSION: Melancoly in Flat", audio: document.getElementById('track9') },
            95: { title: "TRANSMISSION: Next Flight Home", audio: document.getElementById('track10') },
            96: { title: "TRANSMISSION: Cinderella Shoe", audio: document.getElementById('track11') },
            97: { title: "TRANSMISSION: Chase", audio: document.getElementById('track12') },
            98: { title: "TRANSMISSION: Writes Itself", audio: document.getElementById('track13') },
            99: { title: "TRANSMISSION: Monster", audio: document.getElementById('track14') },
            100: { title: "TRANSMISSION: Blisss", audio: document.getElementById('track15') },
            101: { title: "TRANSMISSION: Tangerine", audio: document.getElementById('track16') },
            102: { title: "TRANSMISSION: Across Bourbon Street", audio: document.getElementById('track17') },
            103: { title: "TRANSMISSION: Eveille", audio: document.getElementById('track18') },
            104: { title: "TRANSMISSION: Grave", audio: document.getElementById('track19') },
            105: { title: "TRANSMISSION: Always", audio: document.getElementById('track20') },
            106: { title: "TRANSMISSION: Dancer", audio: document.getElementById('track21') },
            107: { title: "TRANSMISSION: Push", audio: document.getElementById('track22') },
            108: { title: "TRANSMISSION: Resounding", audio: document.getElementById('track23') },
            109: { title: "TRANSMISSION: Pacis", audio: document.getElementById('track24') }
        };

        // Dynamically build the car radio scale display ticks and labels
        const tickElements = {};
        for (let f = minFreq; f <= maxFreq; f++) {
            const percent = ((f - minFreq) / (maxFreq - minFreq)) * 100;
            
            const tick = document.createElement('div');
            tick.className = 'freq-tick';
            if (f % 5 === 0) tick.classList.add('major');
            if (stations[f]) {
                tick.classList.add('station-tick');
                tickElements[f] = tick;
            }
            tick.style.left = `${percent}%`;
            scaleBar.appendChild(tick);

            if (f % 5 === 0) {
                const label = document.createElement('div');
                label.className = 'freq-label';
                label.style.left = `${percent}%`;
                label.innerText = f;
                scaleBar.appendChild(label);
            }
        }

        // Initialize background audio looping simulation
        for (let key in stations) {
            let aud = stations[key].audio;
            aud.addEventListener('loadedmetadata', () => {
                if (aud.duration && !isNaN(aud.duration)) {
                    aud.currentTime = Math.random() * aud.duration;
                }
            });
            aud.muted = true;
            aud.play().catch(() => {});
        }

        let activeAudio = null;

        tuner.addEventListener('input', (e) => {
            const freq = parseInt(e.target.value);
            const percent = ((freq - minFreq) / (maxFreq - minFreq)) * 100;
            needle.style.left = `${percent}%`;

            // Update active station ticks on the visual display
            for (let f in tickElements) {
                if (parseInt(f) === freq) {
                    tickElements[f].classList.add('active');
                } else {
                    tickElements[f].classList.remove('active');
                }
            }

            const lockedStation = stations[freq];

            if (lockedStation) {
                stationDisplay.innerHTML = `[ LOCKED ] > ${lockedStation.title} (${freq} MHz)`;
                
                for (let key in stations) {
                    let aud = stations[key].audio;
                    if (aud === lockedStation.audio) {
                        aud.muted = false;
                        if (aud.paused) {
                            aud.play().catch(() => {});
                        }
                    } else {
                        aud.muted = true;
                    }
                }
                activeAudio = lockedStation.audio;
            } else {
                for (let key in stations) {
                    stations[key].audio.muted = true;
                }
                activeAudio = null;
                stationDisplay.innerHTML = `STATIC... [ FREQ: ${freq} MHz ]`;
            }
        });
    </script>
</body>
</html>
