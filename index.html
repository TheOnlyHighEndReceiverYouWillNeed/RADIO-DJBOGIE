<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radio Console</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --amber-glow: #ffb733; }
        html, body { max-width: 100%; overflow-x: hidden; box-sizing: border-box; margin: 0; padding: 0; }
        *, *:before, *:after { box-sizing: inherit; }
        body {
            background: #0b0604 url('photo/background.png') center/cover fixed no-repeat;
            color: #d8c2a8; font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; padding: 20px; user-select: none;
            -webkit-user-select: none;
        }
        body::before {
            content: ''; position: fixed; inset: 0; background: rgba(11, 6, 4, 0.75); pointer-events: none; z-index: 1;
        }
        .console-container {
            position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9;
            background: #2b1408 url('photo/radioconsole%20image.jpg') center/100% 100% no-repeat;
            box-shadow: 0 35px 75px rgba(0,0,0,0.95); border-radius: 12px; overflow: hidden; z-index: 2;
        }
        /* Expanded touch targets for mobile usability */
        .interactive-volume { 
            position: absolute; top: 20%; left: 3%; width: 12%; height: 25%; 
            cursor: pointer; border-radius: 50%; touch-action: none; z-index: 10; 
        }
        .interactive-tuning { 
            position: absolute; top: 20%; right: 3%; width: 12%; height: 25%; 
            cursor: pointer; border-radius: 50%; touch-action: none; z-index: 10; 
        }
        
        .interactive-dial { 
            position: absolute; top: 20%; left: 16%; right: 16%; height: 30%; 
            cursor: ew-resize; touch-action: none; z-index: 10;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        
        .tuning-indicator-bar {
            position: absolute; top: 27.3%; height: 5.2%; width: 10px;
            background: linear-gradient(to bottom, rgba(255,150,0,0.6), #ffe885 50%, rgba(255,150,0,0.6));
            border-radius: 2px; box-shadow: 0 0 10px 2px var(--amber-glow), inset 0 0 3px #fff;
            transform: translateX(-50%); pointer-events: none; transition: left 0.04s ease-out; z-index: 3;
        }

        .dial-finger-glow {
            position: absolute; top: 0; left: 50%; width: 40px; height: 100%;
            background: radial-gradient(circle, rgba(255,183,51,0.25) 0%, rgba(255,183,51,0) 70%);
            border-left: 1px dashed rgba(255,183,51,0.4); border-right: 1px dashed rgba(255,183,51,0.4);
            transform: translateX(-50%); pointer-events: none; opacity: 0;
            transition: opacity 0.2s ease, left 0.04s ease-out; z-index: 9;
        }
        .interactive-dial:hover .dial-finger-glow,
        .interactive-dial.active .dial-finger-glow { opacity: 1; }

        .screen-display {
            position: absolute; top: 53.5%; left: 27%; right: 27%; height: 10.5%;
            background: rgba(18, 10, 4, 0.85); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
            color: var(--amber-glow); letter-spacing: 1px; text-shadow: 0 0 8px var(--amber-glow);
            box-shadow: inset 0 0 10px rgba(255, 157, 0, 0.2); padding: 0 10px; text-align: center; z-index: 5;
        }
        .visualizer { position: absolute; top: 73.5%; left: 5%; right: 5%; height: 12.5%; pointer-events: none; z-index: 4; }
        #visualizerCanvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="console-container">
        <div class="interactive-volume" id="volumeTrigger"></div>
        <div id="tuningBar" class="tuning-indicator-bar" style="left: 50%;"></div>
        <div class="interactive-dial" id="dialWindow">
            <div id="fingerGlow" class="dial-finger-glow"></div>
        </div>
        <div class="interactive-tuning" id="tuningTrigger"></div>
        <div class="screen-display" id="stationDisplay">RECEIVER STATUS: STANDBY... TAP DIAL TO POWER ON</div>
        <div class="visualizer"><canvas id="visualizerCanvas"></canvas></div>
    </div>
    <audio id="mainAudio" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></audio>
    <script>
        const tuningBar = document.getElementById('tuningBar');
        const fingerGlow = document.getElementById('fingerGlow');
        const stationDisplay = document.getElementById('stationDisplay');
        const audioEl = document.getElementById('mainAudio');
        const dialWindow = document.getElementById('dialWindow');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;

        let audioCtx = null, analyser = null, sourceNode = null, gainNode = null, hls = null;
        let isPowerOn = false, particles = [];
        let currentUrl = "";

        const stations = {
            88.0: { name: "Omega", file: "audio/estrange.mp3" },                    
            88.5: { name: "Duo Improbable - Trent Reznor & Johnny Cash - Hurt", file: "audio/hurt.mp3" },
            89.0: { name: "Iota Alpha", file: "audio/always.mp3" },
            90.0: { name: "Kappa Zeta", file: "audio/automatism.mp3" },
            91.0: { name: "Mu Delta", file: "audio/bliss.mp3" },
            91.5: { name: "Sessions", file: "audio/Sessions.mp3" },
            91.7: { name: "Lambda Delta", file: "audio/chase.mp3" },
            92.0: { name: "Lambda Eta", file: "audio/cinderella-shoe.mp3" },
            92.5: { name: "Iota Delta", file: "audio/cohesion.mp3" },
            93.0: { name: "Mu Beta", file: "audio/cohesion.mp3" },
            93.3: { name: "Duo Improbable - Eric Carmen & Céline Dion - All By Myself", file: "audio/all-by-myself.mp3" },
            93.5: { name: "Lambda Theta", file: "audio/dynamite.mp3" },
            94.0: { name: "Mu", file: "audio/equanimity.mp3" },
            94.5: { name: "Kappa Alpha", file: "audio/esprit-itinerant.mp3" },
            95.0: { name: "Lambda Alpha", file: "audio/late.mp3" },
            95.1: { name: "Duo Improbable - Stewart Copeland & Sting - King of Pain", file: "audio/king-of-pain.mp3" },
            96.0: { name: "Lambda Mu", file: "audio/father.mp3" },
            96.5: { name: "Lambda Stigma", file: "audio/grave.mp3" },
            97.0: { name: "Kappa Eta", file: "audio/inversion.mp3" },
            97.5: { name: "Mu Alpha", file: "audio/lucioles.mp3" },
            98.0: { name: "Kappa Gamma", file: "audio/mass-effect.mp3" },
            99.0: { name: "Iota Stigma", file: "audio/melancoly-in-flat.mp3" },
            99.5: { name: "Mu Epsilon", file: "audio/monster.mp3" },
            100.0: { name: "Iota Epsilon", file: "audio/narcosis.mp3" },
            100.5: { name: "Lambda Nu", file: "audio/next-flight-home.mp3" },
            101.0: { name: "Lambda", file: "audio/oticons.mp3" },
            101.5: { name: "Lambda Gamma", file: "audio/pacis.mp3" },
            101.7: { name: "Duo Improbable - Donna Summer & Clara Luciani", file: "audio/i-feel-love-clara-luciani.wav" },
            102.0: { name: "Iota Zeta", file: "audio/push.mp3" },
            102.5: { name: "Kappa Theta", file: "audio/quantum-touch.mp3" },
            103.0: { name: "Mu Zeta", file: "audio/quaturo.mp3" },
            103.5: { name: "Iota Eta", file: "audio/recalcitrant.mp3" },
            104.0: { name: "Iota Zeta", file: "audio/resounding.mp3" },
            104.5: { name: "Lambda Xi", file: "audio/sacrifice.mp3" },
            105.0: { name: "Iota", file: "audio/slow-think.mp3" },
            105.5: { name: "Kappa Iota", file: "audio/soleil.mp3" },
            106.0: { name: "Kappa Delta", file: "audio/spectrum.mp3" },
            106.5: { name: "Lambda Zeta", file: "audio/stubborness.mp3" },
            107.0: { name: "Mu Theta", file: "audio/tangerine.mp3" },
            107.5: { name: "Kappa Beta", file: "audio/the-daunting.mp3" }
        };

        function initParticles(w, h) {
            particles = Array.from({length: 20}, () => ({
                x: Math.random() * w, y: Math.random() * h,
                size: Math.random() * 2 + 0.5, speed: Math.random() * 0.4 + 0.1, opacity: Math.random() * 0.3 + 0.1
            }));
        }

        function resize() {
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initParticles(rect.width, rect.height);
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                sourceNode = audioCtx.createMediaElementSource(audioEl);
                sourceNode.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch (e) { console.error("Audio Context Init Error: ", e); }
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const w = rect.width; const h = rect.height;
            ctx.clearRect(0, 0, w, h);
            
            particles.forEach(p => {
                p.x -= p.speed; if (p.x < 0) p.x = w;
                ctx.fillStyle = `rgba(255, 157, 0, ${p.opacity})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            const buf = analyser ? analyser.frequencyBinCount : 512;
            const data = new Uint8Array(buf);
            if (analyser && isPowerOn && !audioEl.paused && audioEl.readyState >= 2) {
                analyser.getByteTimeDomainData(data);
            } else {
                data.fill(128);
            }

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = (isPowerOn && !audioEl.paused && audioEl.readyState >= 2) ? 'rgba(255, 157, 0, 0.85)' : 'rgba(74, 44, 0, 0.4)';
            ctx.beginPath();
            const slice = w / buf;
            for (let i = 0, x = 0; i < buf; i++, x += slice) {
                const y = ((data[i] / 128.0) - 1.0) * (h * 1.1) + (h / 2);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        window.addEventListener('resize', resize);
        resize(); 
        requestAnimationFrame(draw);

        function playSource(url, isLive) {
            if (!isPowerOn || currentUrl === url) return;
            currentUrl = url;
            if (hls) { hls.destroy(); hls = null; }
            audioEl.pause(); audioEl.src = ""; audioEl.loop = !isLive;
            
            if (isLive && url.indexOf('.m3u8') !== -1) {
                if (Hls.isSupported()) {
                    hls = new Hls({ enableWorker: true }); hls.loadSource(url); hls.attachMedia(audioEl);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => audioEl.play().catch(() => {}));
                } else if (audioEl.canPlayType('application/vnd.apple.mpegurl')) {
                    audioEl.src = url; audioEl.load(); audioEl.play().catch(() => {});
                }
            } else {
                audioEl.src = url; audioEl.load(); audioEl.play().catch(() => {});
            }
        }

        function tune(freq) {
            if (!isPowerOn) return;
            const percent = 18.0 + ((freq - 88.0) / (108.0 - 88.0)) * 64.0;
            tuningBar.style.left = `${percent}%`;
            fingerGlow.style.left = `${((freq - 88.0) / (108.0 - 88.0)) * 100}%`;
            
            const keys = Object.keys(stations).map(Number);
            const closest = keys.reduce((p, c) => Math.abs(c - freq) < Math.abs(p - freq) ? c : p);
            
            if (Math.abs(freq - closest) <= 0.25) {
                const s = stations[closest];
                stationDisplay.textContent = `[ ${s.isLive ? 'LIVE' : 'LOCKED'} ] > ${s.name} (${closest.toFixed(1)} MHz)`;
                playSource(s.file, s.isLive);
            } else {
                if (hls) { hls.destroy(); hls = null; }
                currentUrl = "";
                stationDisplay.textContent = `MUTED (DEAD AIR)... [ FREQ: ${freq.toFixed(1)} MHz ]`;
                audioEl.pause(); audioEl.src = "";
            }
        }

        function handleInteraction(clientX) {
            if (!isPowerOn) {
                isPowerOn = true; initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                tune(88.0); return;
            }
            const rect = dialWindow.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            tune(Number((88.0 + (ratio * 20.0)).toFixed(1)));
        }

        let isDragging = false;
        
        // Unified Pointer Event Engine (handles mouse, touch, and stylus seamlessly)
        dialWindow.addEventListener('pointerdown', (e) => {
            isDragging = true;
            dialWindow.classList.add('active');
            dialWindow.setPointerCapture(e.pointerId);
            handleInteraction(e.clientX);
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) handleInteraction(e.clientX);
        });

        const endDrag = (e) => {
            if (isDragging) {
                isDragging = false;
                dialWindow.classList.remove('active');
                try {
                    dialWindow.releasePointerCapture(e.pointerId);
                } catch (err) {}
            }
        };

        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);

        window.addEventListener('DOMContentLoaded', () => {
            const wake = () => {
                if (!isPowerOn) {
                    isPowerOn = true; initAudio();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    tune(88.0);
                }
                window.removeEventListener('click', wake);
                window.removeEventListener('touchstart', wake);
            };
            window.addEventListener('click', wake);
            window.addEventListener('touchstart', wake);
        });
    </script>
</body>
</html>
